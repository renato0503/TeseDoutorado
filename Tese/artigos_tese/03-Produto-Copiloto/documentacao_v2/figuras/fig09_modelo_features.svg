<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="feature-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="tfidf-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="if-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bg-grad)"/>

  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Fluxo de Features: Entrada → Engenharia → Predição</text>
  <text x="450" y="55" text-anchor="middle" font-size="11" fill="#94a3b8">Pipeline completo de transformação de 11 features (Risk Engine v1.3)</text>

  <!-- Input Text -->
  <g transform="translate(50, 100)">
    <rect width="200" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MINUTA DE</text>
    <text x="100" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">EDITAL (.txt)</text>
    <text x="100" y="90" text-anchor="middle" font-size="10" fill="#64748b">Texto bruto</text>
    <text x="100" y="110" text-anchor="middle" font-size="10" fill="#64748b">~2-5 KB</text>
  </g>

  <line x1="255" y1="160" x2="295" y2="160" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/></marker></defs>

  <!-- Stage 1: NLP Extraction -->
  <g transform="translate(300, 80)">
    <rect width="280" height="180" rx="10" fill="#1e293b" stroke="#0d9488" stroke-width="2" filter="url(#glow)"/>
    <text x="140" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">ESTÁGIO 1: NLP / Regex</text>
    <text x="140" y="50" text-anchor="middle" font-size="10" fill="#94a3b8">16 padrões de cláusulas (Lei 14.133/2021)</text>
    
    <g transform="translate(20, 60)" font-size="9" fill="#e2e8f0">
      <text x="0" y="0">✓ objeto · ✓ fundamentacao · ✓ criterio_julgamento · ✓ vigencia</text>
      <text x="0" y="18">✓ pagamento · ✓ habilitacao · ✓ sancões · ✓ garantia</text>
      <text x="0" y="36">✓ dotacao · ✓ recebimento · ✓ propriedade_intelectual</text>
      <text x="0" y="54">✓ confidencialidade · ✓ sla · ✓ rescisao · ✓ inovacao</text>
      <text x="0" y="72">✓ sustentabilidade</text>
    </g>
    
    <text x="140" y="160" text-anchor="middle" font-size="10" fill="#0d9488" font-weight="600">→ Score conformidade (0-100%) + Lacunas por prioridade</text>
  </g>

  <line x1="585" y1="160" x2="625" y2="160" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2: TF-IDF + IF -->
  <g transform="translate(630, 80)">
    <rect width="250" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
    <text x="125" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">ESTÁGIO 2: TF-IDF + IF</text>
    <text x="125" y="50" text-anchor="middle" font-size="10" fill="#94a3b8">Objeto → vetor 500 dim</text>
    
    <g transform="translate(20, 60)" font-size="9" fill="#e2e8f0">
      <text x="0" y="0">TF-IDF Vectorizer (500 features)</text>
      <text x="0" y="20">→ Isolation Forest (15k PNCP)</text>
      <text x="0" y="40">→ anomaly_score (contínuo)</text>
      <text x="0" y="60">→ if_flag (binário: -1/1)</text>
      <text x="0" y="80">→ Contribui 2 features ML</text>
    </g>
  </g>

  <!-- Arrow down to ML features -->
  <line x1="450" y1="275" x2="450" y2="305" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 11 Features Box -->
  <g transform="translate(150, 310)">
    <rect width="600" height="150" rx="10" fill="#0d9488" opacity="0.15" stroke="#0d9488" stroke-width="2" filter="url(#glow)"/>
    <text x="300" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">11 FEATURES DO RANDOM FOREST (risk_engine.py)</text>
    
    <g transform="translate(30, 35)" font-size="9" fill="#e2e8f0">
      <!-- Column 1 -->
      <text x="0" y="0" fill="#0d9488" font-weight="700">Texto (4):</text>
      <text x="10" y="20">objeto_len · objeto_palavras</text>
      <text x="10" y="38">complexidade_lexica · densidade_tecnica</text>
      
      <text x="0" y="60" fill="#3b82f6" font-weight="700">Anomalia (2):</text>
      <text x="10" y="80">if_score · if_flag</text>
      
      <text x="0" y="105" fill="#f59e0b" font-weight="700">Estruturais (3):</text>
      <text x="10" y="125">valor_log · vigencia_log · tipo_encoded</text>
      
      <!-- Column 2 -->
      <text x="320" y="0" fill="#10b981" font-weight="700">Geográficos (1):</text>
      <text x="330" y="20">uf_encoded</text>
      
      <text x="320" y="50" fill="#a855f7" font-weight="700">Interação (1):</text>
      <text x="330" y="70">score_tecnico</text>
    </g>
  </g>

  <!-- Arrow to model -->
  <line x1="450" y1="465" x2="450" y2="495" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Output -->
  <g transform="translate(250, 500)" opacity="0">
    <rect width="400" height="60" rx="8" fill="#0d9488" filter="url(#glow)"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PREDITOR: Random Forest (100 árvores)</text>
    <text x="200" y="50" text-anchor="middle" font-size="11" fill="#ccfbf1">→ risco_alto (0/1) + prob_risco_alto (0-1) + SHAP values</text>
  </g>

  <text x="450" y="585" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Fonte: PubliCopilot v1.3 · functions/main.py → risk_engine.py → model_loader.py</text>
</svg>