<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="hosting-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="auth-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="func-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="data-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg-grad)"/>

  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Arquitetura do PubliCopilot v1.3</text>
  <text x="600" y="65" text-anchor="middle" font-size="13" fill="#64748b">Quatro camadas no Firebase: Apresentação, Autenticação, Backend (Cloud Functions) e Dados (Firestore)</text>

  <!-- Top label: User -->
  <g transform="translate(520, 90)">
    <rect width="160" height="50" rx="25" fill="#0f172a" filter="url(#shadow)"/>
    <text x="80" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Usuário (Browser)</text>
  </g>

  <line x1="600" y1="140" x2="600" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 1: Apresentação (Hosting) -->
  <g transform="translate(60, 175)">
    <rect width="1080" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1080" height="32" rx="12" fill="url(#hosting-grad)"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#fff">CAMADA 1 — APRESENTAÇÃO (Firebase Hosting)</text>
    <text x="1060" y="22" text-anchor="end" font-size="11" font-weight="600" fill="#fff">Static CDN</text>
    <g transform="translate(20, 45)">
      <rect width="160" height="25" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="80" y="18" text-anchor="middle" font-size="11" fill="#1e3a8a">index.html (Landing)</text>
    </g>
    <g transform="translate(190, 45)">
      <rect width="180" height="25" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="90" y="18" text-anchor="middle" font-size="11" fill="#1e3a8a">theme.css (700 linhas)</text>
    </g>
    <g transform="translate(380, 45)">
      <rect width="180" height="25" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="90" y="18" text-anchor="middle" font-size="11" fill="#1e3a8a">auth.js + captcha</text>
    </g>
    <g transform="translate(570, 45)">
      <rect width="200" height="25" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#1e3a8a">modulo_avaliacao.html</text>
    </g>
    <g transform="translate(780, 45)">
      <rect width="200" height="25" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#1e3a8a">modulo_geracao.html</text>
    </g>
  </g>

  <line x1="600" y1="255" x2="600" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="278" font-size="10" fill="#64748b" font-style="italic">HTTPS / CDN Global</text>

  <!-- LAYER 2: Autenticação (Firebase Auth) -->
  <g transform="translate(60, 290)">
    <rect width="1080" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1080" height="32" rx="12" fill="url(#auth-grad)"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#fff">CAMADA 2 — AUTENTICAÇÃO (Firebase Authentication)</text>
    <text x="1060" y="22" text-anchor="end" font-size="11" font-weight="600" fill="#fff">RBAC + JWT</text>
    <g transform="translate(20, 45)">
      <rect width="200" height="25" rx="4" fill="#fef3c7" stroke="#b45309"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#78350f">Email/Senha + Google OAuth</text>
    </g>
    <g transform="translate(230, 45)">
      <rect width="200" height="25" rx="4" fill="#fef3c7" stroke="#b45309"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#78350f">CAPTCHA matemático</text>
    </g>
    <g transform="translate(440, 45)">
      <rect width="220" height="25" rx="4" fill="#fef3c7" stroke="#b45309"/>
      <text x="110" y="18" text-anchor="middle" font-size="11" fill="#78350f">IndexedDB (sessão persistente)</text>
    </g>
    <g transform="translate(670, 45)">
      <rect width="180" height="25" rx="4" fill="#fef3c7" stroke="#b45309"/>
      <text x="90" y="18" text-anchor="middle" font-size="11" fill="#78350f">Custom Claims (admin)</text>
    </g>
    <g transform="translate(860, 45)">
      <rect width="200" height="25" rx="4" fill="#fef3c7" stroke="#b45309"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#78350f">JWT Bearer (RFC 7519)</text>
    </g>
  </g>

  <line x1="600" y1="370" x2="600" y2="405" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="393" font-size="10" fill="#64748b" font-style="italic">Authorization: Bearer &lt;token&gt;</text>

  <!-- LAYER 3: Backend (Cloud Functions Python 3.11) -->
  <g transform="translate(60, 405)">
    <rect width="1080" height="100" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1080" height="32" rx="12" fill="url(#func-grad)"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#fff">CAMADA 3 — BACKEND (Cloud Functions · Python 3.11)</text>
    <text x="1060" y="22" text-anchor="end" font-size="11" font-weight="600" fill="#fff">ML real (RF + SHAP)</text>
    <g transform="translate(20, 45)">
      <rect width="250" height="25" rx="4" fill="#ccfbf1" stroke="#0d9488"/>
      <text x="125" y="18" text-anchor="middle" font-size="11" fill="#134e4a">/api/analisar · analisar_minuta()</text>
    </g>
    <g transform="translate(280, 45)">
      <rect width="250" height="25" rx="4" fill="#ccfbf1" stroke="#0d9488"/>
      <text x="125" y="18" text-anchor="middle" font-size="11" fill="#134e4a">/set_admin_claim (RBAC)</text>
    </g>
    <g transform="translate(540, 45)">
      <rect width="180" height="25" rx="4" fill="#ccfbf1" stroke="#0d9488"/>
      <text x="90" y="18" text-anchor="middle" font-size="11" fill="#134e4a">firebase-admin</text>
    </g>
    <g transform="translate(730, 45)">
      <rect width="170" height="25" rx="4" fill="#ccfbf1" stroke="#0d9488"/>
      <text x="85" y="18" text-anchor="middle" font-size="11" fill="#134e4a">JWT validation</text>
    </g>
    <g transform="translate(910, 45)">
      <rect width="150" height="25" rx="4" fill="#ccfbf1" stroke="#0d9488"/>
      <text x="75" y="18" text-anchor="middle" font-size="11" fill="#134e4a">CORS whitelist</text>
    </g>
    <g transform="translate(20, 70)">
      <text x="0" y="0" font-size="10" font-weight="600" fill="#0f172a">5 Estágios do Pipeline ML:</text>
    </g>
    <g transform="translate(180, 65)">
      <rect width="100" height="20" rx="10" fill="#0d9488"/>
      <text x="50" y="14" text-anchor="middle" font-size="10" fill="#fff">NLP/Regex</text>
    </g>
    <g transform="translate(290, 65)">
      <rect width="100" height="20" rx="10" fill="#0d9488"/>
      <text x="50" y="14" text-anchor="middle" font-size="10" fill="#fff">IF (anomalias)</text>
    </g>
    <g transform="translate(400, 65)">
      <rect width="100" height="20" rx="10" fill="#0d9488"/>
      <text x="50" y="14" text-anchor="middle" font-size="10" fill="#fff">RF (risco)</text>
    </g>
    <g transform="translate(510, 65)">
      <rect width="100" height="20" rx="10" fill="#0d9488"/>
      <text x="50" y="14" text-anchor="middle" font-size="10" fill="#fff">SHAP (XAI)</text>
    </g>
    <g transform="translate(620, 65)">
      <rect width="170" height="20" rx="10" fill="#0d9488"/>
      <text x="85" y="14" text-anchor="middle" font-size="10" fill="#fff">Contrafactuais normativos</text>
    </g>
    <g transform="translate(800, 65)">
      <text x="0" y="14" font-size="10" fill="#64748b">← 11 modelos .pkl (27,35 MB)</text>
    </g>
  </g>

  <line x1="600" y1="505" x2="600" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="528" font-size="10" fill="#64748b" font-style="italic">Firestore SDK · Persistência</text>

  <!-- LAYER 4: Dados (Firestore) -->
  <g transform="translate(60, 540)">
    <rect width="1080" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1080" height="32" rx="12" fill="url(#data-grad)"/>
    <text x="20" y="22" font-size="14" font-weight="700" fill="#fff">CAMADA 4 — DADOS (Firestore + Rules RBAC)</text>
    <text x="1060" y="22" text-anchor="end" font-size="11" font-weight="600" fill="#fff">NoSQL + Regras</text>
    <g transform="translate(20, 45)">
      <rect width="200" height="25" rx="4" fill="#f3e8ff" stroke="#7e22ce"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#581c87">/usuarios (RBAC)</text>
    </g>
    <g transform="translate(230, 45)">
      <rect width="200" height="25" rx="4" fill="#f3e8ff" stroke="#7e22ce"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#581c87">/avaliacoes (histórico)</text>
    </g>
    <g transform="translate(440, 45)">
      <rect width="200" height="25" rx="4" fill="#f3e8ff" stroke="#7e22ce"/>
      <text x="100" y="18" text-anchor="middle" font-size="11" fill="#581c87">/editais (gerados)</text>
    </g>
    <g transform="translate(650, 45)">
      <rect width="180" height="25" rx="4" fill="#f3e8ff" stroke="#7e22ce"/>
      <text x="90" y="18" text-anchor="middle" font-size="11" fill="#581c87">/logs (imutável)</text>
    </g>
    <g transform="translate(840, 45)">
      <rect width="220" height="25" rx="4" fill="#f3e8ff" stroke="#7e22ce"/>
      <text x="110" y="18" text-anchor="middle" font-size="11" fill="#581c87">firestore.rules (isAdminByClaim)</text>
    </g>
  </g>

  <text x="600" y="660" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Fonte: Elaboração própria (v1.3, 19/07/2026). URL de produção: https://comprapublica.web.app</text>
</svg>
