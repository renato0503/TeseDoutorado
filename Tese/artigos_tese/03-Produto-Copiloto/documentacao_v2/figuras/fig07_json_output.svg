<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Fira Code', 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="json-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#json-bg)"/>

  <!-- Header -->
  <text x="50" y="30" font-size="14" font-weight="700" fill="#10b981">📤 Saída JSON do Pipeline de ML</text>
  <text x="50" y="50" font-size="10" fill="#64748b">Estrutura completa retornada pela função analisar_minuta() — PubliCopilot v1.3</text>

  <!-- JSON Content -->
  <g transform="translate(40, 70)" font-size="11" fill="#e2e8f0">
    <text x="0" y="20">{</text>
    
    <!-- risk_score -->
    <text x="20" y="40" fill="#fbbf24">"risk_score"</text>
    <text x="180" y="40" fill="#64748b">:</text>
    <text x="195" y="40" fill="#34d399">73.4</text>
    <text x="250" y="40" fill="#64748b">,</text>
    
    <!-- risk_level -->
    <text x="20" y="60" fill="#fbbf24">"risk_level"</text>
    <text x="180" y="60" fill="#64748b">:</text>
    <text x="195" y="60" fill="#a78bfa">"MEDIO_ALTO"</text>
    <text x="290" y="60" fill="#64748b">,</text>
    
    <!-- gaps_detected -->
    <text x="20" y="80" fill="#fbbf24">"gaps_detected"</text>
    <text x="180" y="80" fill="#64748b">:</text>
    <text x="195" y="80">[</text>
    <text x="220" y="100" fill="#a78bfa">"Garantia Contratual"</text>
    <text x="400" y="100" fill="#64748b">,</text>
    <text x="220" y="120" fill="#a78bfa">"SLA / Níveis de Serviço"</text>
    <text x="430" y="120" fill="#64748b">,</text>
    <text x="220" y="140" fill="#a78bfa">"Rescisão Contratual"</text>
    <text x="410" y="140" fill="#64748b">,</text>
    <text x="220" y="160" fill="#a78bfa">"LGPD / Confidencialidade"</text>
    <text x="430" y="160" fill="#64748b">,</text>
    <text x="220" y="180" fill="#a78bfa">"Propriedade Intelectual"</text>
    <text x="420" y="180">,</text>
    <text x="195" y="200">]</text>
    <text x="250" y="200" fill="#64748b">,</text>
    
    <!-- shap_values -->
    <text x="20" y="220" fill="#fbbf24">"shap_values"</text>
    <text x="180" y="220" fill="#64748b">:</text>
    <text x="195" y="220">{</text>
    <text x="220" y="240" fill="#a78bfa">"vigencia_log"</text>
    <text x="360" y="240" fill="#64748b">:</text>
    <text x="375" y="240" fill="#34d399">0.76</text>
    <text x="420" y="240" fill="#64748b">,</text>
    <text x="220" y="260" fill="#a78bfa">"tipo_encoded"</text>
    <text x="360" y="260" fill="#64748b">:</text>
    <text x="375" y="260" fill="#34d399">0.07</text>
    <text x="420" y="260" fill="#64748b">,</text>
    <text x="220" y="280" fill="#a78bfa">"uf_encoded"</text>
    <text x="360" y="280" fill="#64748b">:</text>
    <text x="375" y="280" fill="#34d399">0.06</text>
    <text x="420" y="280" fill="#64748b">,</text>
    <text x="220" y="300" fill="#a78bfa">"objeto_len"</text>
    <text x="360" y="300" fill="#64748b">:</text>
    <text x="375" y="300" fill="#34d399">0.03</text>
    <text x="420" y="300" fill="#64748b">,</text>
    <text x="220" y="320" fill="#a78bfa">"valor_log"</text>
    <text x="360" y="320" fill="#64748b">:</text>
    <text x="375" y="320" fill="#34d399">0.03</text>
    <text x="195" y="340">}</text>
    <text x="250" y="340" fill="#64748b">,</text>
    
    <!-- counterfactuals -->
    <text x="20" y="360" fill="#fbbf24">"counterfactuals"</text>
    <text x="180" y="360" fill="#64748b">:</text>
    <text x="195" y="360">[</text>
    <text x="220" y="380">{</text>
    <text x="240" y="400" fill="#a78bfa">"feature"</text>
    <text x="340" y="400" fill="#64748b">:</text>
    <text x="355" y="400" fill="#a78bfa">"garantia_contratual"</text>
    <text x="500" y="400" fill="#64748b">,</text>
    <text x="240" y="420" fill="#a78bfa">"current"</text>
    <text x="340" y="420" fill="#64748b">:</text>
    <text x="355" y="420" fill="#a78bfa">"ausente"</text>
    <text x="480" y="420" fill="#64748b">,</text>
    <text x="240" y="440" fill="#a78bfa">"suggested"</text>
    <text x="340" y="440" fill="#64748b">:</text>
    <text x="355" y="440" fill="#a78bfa">"5% do valor"</text>
    <text x="500" y="440" fill="#64748b">,</text>
    <text x="240" y="460" fill="#a78bfa">"impact_score"</text>
    <text x="340" y="460" fill="#64748b">:</text>
    <text x="355" y="460" fill="#34d399">-0.12</text>
    <text x="220" y="480">}</text>
    <text x="195" y="500">]</text>
    <text x="195" y="520">}</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 480)" font-size="9">
    <text x="0" y="0" fill="#fbbf24">Chaves</text>
    <text x="80" y="0" fill="#a78bfa">Strings</text>
    <text x="160" y="0" fill="#34d399">Números</text>
    <text x="240" y="0" fill="#64748b">Pontuação</text>
  </g>
</svg>